<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Justin Morris — Portfolio has moved</title><!-- Root of the retired GitHub Pages site; forwards to the live portfolio. Deep links are handled by 404.html. -->
<script>
  // Preserve deep path, query string (including ?access=resume), and hash.
  // Works whether Pages serves this at the root or under /portfolio.
  var path = location.pathname.replace(/^\/portfolio(?=\/|$)/, "");
  location.replace("https://justinhasaportfolio.netlify.app" + path + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://justinhasaportfolio.netlify.app/">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; align-items: center; justify-content: center;
         min-height: 90vh; margin: 0; color: #111; }
  main { text-align: center; padding: 2rem; }
  a { color: #111; }
</style>
</head>
<body>
<main>
  <p>This portfolio has moved.</p>
  <p><a href="https://justinhasaportfolio.netlify.app/">Continue to justinhasaportfolio.netlify.app</a></p>
</main>
</body>
</html>
